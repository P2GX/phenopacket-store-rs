[package]
name = "ppktstore"
version = "0.1.1-dev"
edition = "2024"
description = "A storage interface for Phenopackets."
license = "MIT OR Apache-2.0"
repository = "https://github.com/P2GX/phenopacket-store-rs"
keywords = ["phenopacket", "phenopackets", "ga4gh", "storage"]
authors = ["Niclas Casimir Grote", "Daniel Danis"]

[dependencies]
phenopackets = "0.2.2-post2"
prost = "0.14.4"
serde = {version = "1.0.229",features = ["derive", "std"]}
serde_json = "1.0.154"
uuid = {version = "1.28.0", features = ["v4", "serde"]}
ontolius = { version = "0.8.2", optional = true }
zip = { version = "9.1.3", optional = true, default-features = false, features = ["deflate"] }

[dev-dependencies]
parameterized = "2.1.0"
tempfile = "3"
ontolius = {version = "0.8.2"}

[features]
ontology-query = ["dep:ontolius"]
import = ["dep:zip", "phenopackets/serde"]

[[example]]
name = "configure-phenostore"

[[test]]
name = "import"
required-features = ["import"]