[package]
name = "ppktstore"
version = "0.1.1-dev"
edition = "2024"
description = "A storage interface for Phenopackets."
license = "MIT OR Apache-2.0"
repository = "https://github.com/P2GX/phenopacket-store-rs"
keywords = ["phenopacket", "phenopackets", "ga4gh", "storage"]
authors = ["Niclas Casimir Grote", "Daniel Danis"]
exclude = ["data/", ".github/"]

[dependencies]
phenopackets = { version = "0.2.2-post2", features = ["serde"] }
prost = "0.14.4"
serde = {version = "1.0.229",features = ["derive", "std"]}
serde_json = "1.0.154"
uuid = {version = "1.28.0", features = ["v4", "serde"]}
ontolius = { version = "0.8.2", optional = true, default-features = false }

[dev-dependencies]
criterion = {version = "0.8.2", features = ["html_reports", "cargo_bench_support"]}
parameterized = "2.1.0"
tempfile = "3"
ontolius = {version = "0.8.2", features = ["csr", "obographs"] }
flate2 = "1.1.10"

[features]
ontolius = ["dep:ontolius"]

[[example]]
name = "configure-phenostore"

[[bench]]
name = "filephenostore"
harness = false

[[bench]]
name = "query-phenopacket"
harness = false
required-features = ["ontology-query"]

[profile.bench]
debug = true